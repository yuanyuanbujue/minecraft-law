<style>

  #qb-root { font-family: 'VT323', monospace; box-sizing: border-box; }
  .qb-pixel { font-family: 'Press Start 2P', monospace; }
  .qb-btn {
    font-family: 'Press Start 2P', monospace;
    font-size: 11px;
    border: 3px solid #000;
    box-shadow: 3px 3px 0 rgba(0,0,0,0.5);
    padding: 10px 14px;
    cursor: pointer;
    letter-spacing: 0.5px;
  }
  .qb-btn:active { box-shadow: 1px 1px 0 rgba(0,0,0,0.5); transform: translate(2px,2px); }
  .qb-btn:disabled { cursor: not-allowed; box-shadow: none; }
  .qb-input, .qb-textarea, .qb-select {
    width: 100%; box-sizing: border-box;
    font-family: 'VT323', monospace; font-size: 20px;
    color: #e8e4d3; background: #14160f;
    border: 3px solid #57604a; padding: 10px 12px; outline: none;

  .qb-toast {
    position: relative; font-family: 'Press Start 2P', monospace; font-size: 9px;
    padding: 10px 14px; margin-bottom: 14px; border: 2px solid #000; line-height: 1.6;
  }

  }

    return `https://minotar.net/avatar/${encodeURIComponent(username)}/${size || 40}`;
  }
  function playerAvatarImg(player, size, cssSize) {
    const px = cssSize || size || 40;

      const src = avatarUrl(player || "Steve", size);
      return `<img class="qb-avatar" src="${esc(src)}" width="${px}" height="${px}" style="object-fit:cover;" alt="" />`;
    }
    // avatar_url = direct image link (takes priority)
    // avatar_skin = custom MC username to pull skin from minotar
    // default: no avatar set at all -> plain Steve skin (not the player's username)
    let src;
    if (player.avatar_url && player.avatar_url.trim()) {
      src = player.avatar_url.trim();
    } else if (player.avatar_skin && player.avatar_skin.trim()) {

  }
  function timeAgo(iso) {
    const diff = Date.now() - new Date(iso).getTime();
    const m = Math.floor(diff / 60000);
    if (m < 1) return "just now";
    if (m < 60) return m + "m ago";
    const h = Math.floor(m / 60);
    if (h < 24) return h + "h ago";

  async function doSignIn() {
    const u = authForm.username.trim();
    const p = authForm.password;
    if (!u) return showToast("enter your username.");
    posting = true; render();

    // First check: does this account have no password? (admin-created open account)
    // Uses a SECURITY DEFINER RPC (direct table select is blocked by RLS and never exposes password_hash to the client)
    const { data: isOpenAccount } = await sb.rpc("qb_check_open_account", { p_username: u });

    if (isOpenAccount) {
      // Anyone can sign in — but must set a password before they can use the account.
      const { data: openRow, error: openErr } = await sb.rpc("qb_open_account_login", { p_username: u }).single();
      posting = false;
      if (openErr || !openRow) { showToast("account not found."); render(); return; }
      // Use the real session token the DB just generated and stored (qb_open_account_login persists it),
      // not a fabricated one — later calls like qb_update_profile verify against the stored token.
      me = { username: openRow.username, status: "online", status_note: openRow.status_note, bio: openRow.bio, rank: openRow.rank, state: openRow.state, created_at: openRow.created_at, last_seen: openRow.last_seen, session_token: openRow.session_token, avatar_url: openRow.avatar_url || null, open: true };
      mustSetPassword = true;
      toast = null;
      authForm.username = ""; authForm.password = "";
      render();
      return;
    }

    // Normal password login
    if (!p) { posting = false; showToast("enter your password."); render(); return; }
    let data, error;
    try {
      ({ data, error } = await sb.rpc("qb_login", { p_username: u, p_password: p }).single());
    } catch (e) { error = e; }
    posting = false;
    if (error || !data) {
      showToast("wrong username or password.");
      render(); return;
    }
    me = { username: data.username, status: data.status, status_note: data.status_note, bio: data.bio, rank: data.rank, state: data.state, created_at: data.created_at, last_seen: data.last_seen, session_token: data.session_token, avatar_url: data.avatar_url || null };
    await afterLogin();
  }

  // Builds the current list of notifications for the signed-in player:
  // quests they posted that have been completed, replies to their community posts,
  // and likes on their community posts. Each entry carries a targetId used to jump
  // straight to the relevant quest/post when the player clicks it.
  function computeNotifications() {
    if (!me) return [];
    const list = [];
    quests.filter(q => q.poster === me.username && q.completed).forEach(q => {
      list.push({
        id: `quest-${q.id}`, type: "quest", time: q.created_at, targetId: q.id,
        text: `your quest "${esc(q.title)}" was completed${q.claimed_by ? ` by ${esc(displayName(players.find(p => p.username === q.claimed_by) || q.claimed_by))}` : ""}.`
      });
    });
    communityPosts.filter(p => p.parent_id && p.username !== me.username).forEach(p => {
      const parent = communityPosts.find(x => x.id === p.parent_id);
      if (parent && parent.username === me.username) {
        const author = players.find(pl => pl.username === p.username) || p.username;
        list.push({
          id: `reply-${p.id}`, type: "reply", time: p.created_at, targetId: parent.id,
          text: `${esc(displayName(author))} replied to your post: "${esc(p.message.length > 60 ? p.message.slice(0, 60) + "…" : p.message)}"`
        });
      }
    });
    communityLikes.filter(l => l.username !== me.username).forEach(l => {
      const post = communityPosts.find(p => p.id === l.post_id);
      if (post && post.username === me.username) {
        const liker = players.find(pl => pl.username === l.username) || l.username;
        list.push({
          id: `like-${l.post_id}-${l.username}`, type: "like", time: post.created_at, targetId: post.id,
          text: `${esc(displayName(liker))} liked your post: "${esc(post.message.length > 60 ? post.message.slice(0, 60) + "…" : post.message)}"`
        });
      }
    });
    list.sort((a, b) => new Date(b.time) - new Date(a.time));
    return list;
  }

  // Shrinks an uploaded image down to a reasonable size/quality so proof photos
  // don't blow up the database — capped at 900px on the long edge, JPEG @ 0.72.
  function compressImageFile(file, maxDim, quality) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > maxDim || h > maxDim) {
            if (w >= h) { h = Math.round(h * (maxDim / w)); w = maxDim; }
            else { w = Math.round(w * (maxDim / h)); h = maxDim; }
          }
          const canvas = document.createElement("canvas");
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL("image/jpeg", quality));
        };
        img.onerror = () => reject(new Error("couldn't read that file as an image."));
        img.src = reader.result;
      };
      reader.onerror = () => reject(new Error("couldn't read that file."));
      reader.readAsDataURL(file);
    });
  }

  let uploadingProofId = null; // quest id currently mid-upload, to disable double submits
  let lightboxPhoto = null; // dataURL of a proof photo currently shown full-size

  async function uploadQuestProof(id, file) {
    if (!file) return;
    if (!/^image\//.test(file.type)) return showToast("please upload an image file.");
    uploadingProofId = id; render();
    let dataUrl;
    try {
      dataUrl = await compressImageFile(file, 900, 0.72);
    } catch (e) {
      uploadingProofId = null;
      showToast(e.message || "couldn't process that image.");
      render();
      return;
    }
    let error;
    try {
      ({ error } = await sb.from("quests").update({ proof_photo: dataUrl }).eq("id", id).eq("claimed_by", me.username));
    } catch (e) { error = e; }
    uploadingProofId = null;
    if (error) {
      const m = error.message || "";
      showToast(
        m.includes("does not exist") || m.includes("proof_photo")
          ? "proof photos need a small database update first — see the setup note below the app."
          : "couldn't upload proof: " + m
      );
      render();
      return;
    }
    showToast("proof photo uploaded!", "gold");
    await loadAll(); render();
  }

    const { error } = await sb.from("quests").update({ proof_photo: null }).eq("id", id).eq("claimed_by", me.username);
    if (error) { showToast("couldn't remove photo: " + error.message); return; }
    await loadAll(); render();

  function handleSkinUpload(file) {
    if (!file) return;
    if (!/image\/png/.test(file.type) && !/\.png$/i.test(file.name || "")) {
      showToast("please upload a .png minecraft skin file.");
      return;
    }
    const reader = new FileReader();
    reader.onload = () => {
      const img = new Image();
      img.onload = () => {
        const w = img.width, h = img.height;
        // Classic minecraft skins are 64x32, modern ones are 64x64. Anything else isn't a skin file.
        if (!((w === 64 && h === 64) || (w === 64 && h === 32))) {
          showToast(`that doesn't look like a minecraft skin (got ${w}×${h}px, expected 64×64 or 64×32).`);
          return;
        }
        // Draw the uploaded skin to a working canvas at native resolution.
        const src = document.createElement("canvas");
        src.width = w; src.height = h;
        const sctx = src.getContext("2d");
        sctx.imageSmoothingEnabled = false;
        sctx.drawImage(img, 0, 0);

        // Head front face lives at (8,8) 8x8px in every skin layout.
        // The "hat" overlay layer (second skin layer) only exists on 64x64 skins, at (40,8) 8x8px.
        const SCALE = 16; // 8px face -> 128px crisp avatar
        const out = document.createElement("canvas");
        out.width = 8 * SCALE; out.height = 8 * SCALE;
        const octx = out.getContext("2d");
        octx.imageSmoothingEnabled = false;
        octx.drawImage(src, 8, 8, 8, 8, 0, 0, out.width, out.height);
        if (h === 64) {
          octx.drawImage(src, 40, 8, 8, 8, 0, 0, out.width, out.height);
        }

        profileForm.avatarUrl = out.toDataURL("image/png");
        profileForm.avatarSkin = "";
        showToast('skin uploaded — face loaded into preview above. hit "save profile" to keep it.', "gold");
        render();
      };
      img.onerror = () => showToast("couldn't read that file as an image.");
      img.src = reader.result;
    };
    reader.onerror = () => showToast("couldn't read that file.");
    reader.readAsDataURL(file);
  }

  function initSkinCanvas() {
    const canvas = document.getElementById("qb-skin-canvas");
    if (!canvas) return;
    const ctx = canvas.getContext("2d");
    ctx.imageSmoothingEnabled = false;
    const GRID = 16;
    const cell = canvas.width / GRID; // 4px per pixel at 256px canvas

    if (skinCanvasSnapshot) {
      const img = new Image();
      img.onload = () => ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      img.src = skinCanvasSnapshot;
    }

    let drawing = false;
    function paintAt(clientX, clientY) {
      const rect = canvas.getBoundingClientRect();
      const x = Math.floor((clientX - rect.left) / rect.width * GRID);
      const y = Math.floor((clientY - rect.top) / rect.height * GRID);
      if (x < 0 || y < 0 || x >= GRID || y >= GRID) return;
      if (skinErasing) {
        ctx.clearRect(x * cell, y * cell, cell, cell);
      } else {
        ctx.fillStyle = skinDrawColor;
        ctx.clearRect(x * cell, y * cell, cell, cell);
        ctx.fillRect(x * cell, y * cell, cell, cell);
      }
    }
    function pos(e) { return e.touches ? e.touches[0] : e; }
    function start(e) { drawing = true; const p = pos(e); paintAt(p.clientX, p.clientY); e.preventDefault(); }
    function move(e) { if (!drawing) return; const p = pos(e); paintAt(p.clientX, p.clientY); e.preventDefault(); }
    function stop() { drawing = false; }
    canvas.addEventListener("mousedown", start);
    canvas.addEventListener("mousemove", move);
    window.addEventListener("mouseup", stop);
    canvas.addEventListener("touchstart", start, { passive: false });
    canvas.addEventListener("touchmove", move, { passive: false });
    canvas.addEventListener("touchend", stop);

    root.querySelectorAll(".qb-skin-color").forEach(b => b.addEventListener("click", () => {
      skinDrawColor = b.dataset.color;
      skinErasing = false;
      render(); // re-render so active ring + color display update
    }));
    const customColor = document.getElementById("qb-skin-color-custom");
    if (customColor) customColor.addEventListener("input", e => { skinDrawColor = e.target.value; skinErasing = false; render(); });

    const eraserBtn = document.getElementById("qb-skin-eraser-btn");
    if (eraserBtn) eraserBtn.addEventListener("click", () => { skinErasing = !skinErasing; render(); });

    const clearBtn = document.getElementById("qb-skin-clear-btn");
    if (clearBtn) clearBtn.addEventListener("click", () => {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      skinCanvasSnapshot = canvas.toDataURL("image/png");
    });

    const useBtn = document.getElementById("qb-skin-use-btn");
    if (useBtn) useBtn.addEventListener("click", () => {
      const exportCanvas = document.createElement("canvas");
      exportCanvas.width = GRID; exportCanvas.height = GRID;
      const exportCtx = exportCanvas.getContext("2d");
      exportCtx.imageSmoothingEnabled = false;
      exportCtx.drawImage(canvas, 0, 0, GRID, GRID);
      skinCanvasSnapshot = canvas.toDataURL("image/png");
      profileForm.avatarUrl = exportCanvas.toDataURL("image/png");
      profileForm.avatarSkin = "";
      showToast('custom icon loaded into preview — hit "save profile" to keep it.', "gold");
    });
  }

  async function submitForcePassword() {
    const p1 = forcePasswordForm.newPassword;
    const p2 = forcePasswordForm.confirmPassword;
    if (!p1 || p1.length < 6) return showToast("password needs at least 6 characters.");
    if (p1 !== p2) return showToast("passwords don't match.");
    posting = true; render();

    // This account currently has no password (p_old_password stays null).
    let updErr;
    try {
      ({ error: updErr } = await sb.rpc("qb_update_profile", {
        p_username: me.username, p_session_token: me.session_token,
        p_bio: me.bio || "", p_status_note: me.status_note || "",
        p_old_password: null, p_new_password: p1
      }).single());
    } catch (e) { updErr = e; }
    if (updErr) {
      posting = false;
      showToast("couldn't set password: " + updErr.message);
      render();
      return;
    }

    // Now log in for real with the new password to get a proper session token
    let data, error;
    try {
      ({ data, error } = await sb.rpc("qb_login", { p_username: me.username, p_password: p1 }).single());
    } catch (e) { error = e; }
    posting = false;
    if (error || !data) {
      showToast("password set — please sign in again with your new password.");
      me = null; mustSetPassword = false; clearSession();
      render();
      return;
    }
    me = { username: data.username, status: data.status, status_note: data.status_note, bio: data.bio, rank: data.rank, state: data.state, created_at: data.created_at, last_seen: data.last_seen, session_token: data.session_token, avatar_url: data.avatar_url || null };
    mustSetPassword = false;
    forcePasswordForm.newPassword = ""; forcePasswordForm.confirmPassword = "";
    await afterLogin();
  }

  function cancelForcePassword() {
    // Abandon this open-account session without setting a password, back to the login menu.
    me = null;
    mustSetPassword = false;
    forcePasswordForm.newPassword = ""; forcePasswordForm.confirmPassword = "";

  async function saveProfile() {
    if (profileForm.newPassword && profileForm.newPassword.length < 6) return showToast("new password needs at least 6 characters.");
    if (profileForm.newPassword && !profileForm.oldPassword) return showToast("enter your current password to change it.");
    const newNickname = profileForm.nickname.trim();
    if (newNickname && newNickname.length > 24) return showToast("nickname: max 24 characters.");
    posting = true; render();
    // Save avatar_url directly (public, self-owned field — no password needed)
    const newAvatarUrl = profileForm.avatarUrl.trim() || null;
    const newAvatarSkin = profileForm.avatarSkin.trim() || null;
    const { error: avatarErr } = await sb.rpc("qb_set_avatar", { p_username: me.username, p_session_token: me.session_token, p_avatar_url: newAvatarUrl, p_avatar_skin: newAvatarSkin });
    if (avatarErr) {
      posting = false;
      const m = avatarErr.message || "";
      showToast(
        m.includes("does not exist") || m.includes("qb_set_avatar")
          ? "avatar changes need a small database update first — see the setup note below the app."
          : "couldn't update avatar: " + m
      );
      render();
      return;
    }
    // Nickname goes through a dedicated RPC (self-service nickname changes are locked down
    // at the database level, same as bio/status_note — the RPC verifies the session token
    // server-side before writing).
    if (newNickname !== (me.nickname || "")) {
      let nickErr;
      try {
        ({ error: nickErr } = await sb.rpc("qb_set_nickname", {
          p_username: me.username, p_session_token: me.session_token, p_nickname: newNickname
        }).single());
      } catch (e) { nickErr = e; }
      if (nickErr) {
        posting = false;
        const msg = nickErr.message || "";
        showToast(
          msg.includes("does not exist") || msg.includes("qb_set_nickname")
            ? "nickname changes need a small database update first — see the setup note below the app."
            : "couldn't update nickname: " + msg
        );
        render();
        return;
      }
    }
    let data, error;
    try {
      ({ data, error } = await sb.rpc("qb_update_profile", {
        p_username: me.username, p_session_token: me.session_token,
        p_bio: profileForm.bio, p_status_note: profileForm.statusNote,
        p_old_password: profileForm.oldPassword || null, p_new_password: profileForm.newPassword || null
      }).single());
    } catch (e) { error = e; }
    posting = false;
    if (error) {
      showToast((error && error.message) || "couldn't update profile.");
      render();
      return;
    }
    me = Object.assign({}, me, { bio: data.bio, status_note: data.status_note, avatar_url: newAvatarUrl, avatar_skin: newAvatarSkin, nickname: newNickname || null });
    profileForm.oldPassword = ""; profileForm.newPassword = "";
    showToast("profile updated.", "gold");
    await loadAll(); render();
  }

              <!-- Use icon button — prominent CTA -->
              <button id="qb-skin-use-btn" class="qb-btn" style="
                ${btn("✔ use this icon", { color: PALETTE.emerald, fontSize: 9, padding: "12px 10px" })}
                width:100%; margin-top:4px; letter-spacing:0;
              ">✔ use this icon</button>
            </div>
          </div>
          <div style="font-size:13px; color:${PALETTE.textDim}; margin-bottom:14px; margin-top:28px;">
            paint a 16×16 pixel icon — click "✔ use this icon" to load it into the preview above, then hit save profile.
          </div>

          <div class="qb-pixel" style="font-size:9px; color:${PALETTE.textDim}; margin-bottom:6px;">nickname (shown instead of your username)</div>
          <input id="qb-profile-nickname" class="qb-input" maxlength="24" placeholder="${esc(me.username)}" value="${esc(profileForm.nickname)}" style="margin-bottom:14px;" />

          <div class="qb-pixel" style="font-size:9px; color:${PALETTE.textDim}; margin-bottom:6px;">status note</div>
          <input id="qb-profile-note" class="qb-input" maxlength="60" placeholder="what are you up to?" value="${esc(profileForm.statusNote)}" style="margin-bottom:14px;" />

          <div class="qb-pixel" style="font-size:9px; color:${PALETTE.textDim}; margin-bottom:6px;">bio</div>
          <textarea id="qb-profile-bio" class="qb-textarea" rows="3" maxlength="300" placeholder="tell people about yourself">${esc(profileForm.bio)}</textarea>

          <div class="qb-pixel" style="font-size:9px; color:${PALETTE.gold}; margin:18px 0 10px;">change password (optional)</div>
          <input id="qb-profile-old-pass" type="password" class="qb-input" placeholder="current password" value="${esc(profileForm.oldPassword)}" style="margin-bottom:10px;" />
          <input id="qb-profile-new-pass" type="password" class="qb-input" placeholder="new password (6+ characters)" value="${esc(profileForm.newPassword)}" />

          <div style="margin-top:18px;">
            <button id="qb-profile-save" class="qb-btn" ${posting ? "disabled" : ""} style="${btn(posting ? "saving..." : "save profile", { disabled: posting })}">${posting ? "saving..." : "save profile"}</button>
          </div>
        </div>
          `;
        })() : ""}
      </div>
      ${lightboxPhoto ? `
        <div id="qb-lightbox" style="position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:2000; display:flex; align-items:center; justify-content:center; padding:2rem; cursor:zoom-out;">
          <img src="${lightboxPhoto}" style="max-width:100%; max-height:100%; border:4px solid ${PALETTE.gold}; box-shadow:0 0 0 4px #000;" alt="proof photo full size" />
        </div>
      ` : ""}
    `;

    document.getElementById("qb-switch-btn").addEventListener("click", logout);
    const notifBell = document.getElementById("qb-notif-bell");
    if (notifBell) notifBell.addEventListener("click", e => { e.stopPropagation(); toggleNotifs(); });
    const notifPanel = document.getElementById("qb-notif-panel");
    if (notifPanel) notifPanel.addEventListener("click", e => e.stopPropagation());
    const notifSettingsBtn = document.getElementById("qb-notif-settings-btn");
    if (notifSettingsBtn) notifSettingsBtn.addEventListener("click", toggleNotifSettings);
    const lightbox = document.getElementById("qb-lightbox");
    if (lightbox) lightbox.addEventListener("click", () => { lightboxPhoto = null; render(); });
    root.querySelectorAll(".qb-notif-filter-cb").forEach(cb => cb.addEventListener("change", e => {
      e.stopPropagation();
      setNotifFilter(cb.dataset.type, cb.checked);
    }));
    root.querySelectorAll(".qb-notif-item").forEach(item => item.addEventListener("click", () => {
      goToNotification(item.dataset.type, item.dataset.target);
    }));
    document.getElementById("qb-status-select").addEventListener("change", e => setStatus(e.target.value));
    document.getElementById("qb-tab-board").addEventListener("click", () => { tab = "board"; toast = null; render(); });
    document.getElementById("qb-tab-post").addEventListener("click", () => { tab = "post"; toast = null; render(); });
    document.getElementById("qb-tab-players").addEventListener("click", async () => { tab = "players"; render(); await loadAll(); render(); });
    document.getElementById("qb-tab-search").addEventListener("click", () => { tab = "search"; render(); });
    document.getElementById("qb-tab-info").addEventListener("click", async () => { tab = "info"; toast = null; render(); await loadAll(); render(); });
    document.getElementById("qb-tab-community").addEventListener("click", async () => { tab = "community"; toast = null; render(); await loadAll(); render(); });
    document.getElementById("qb-tab-leaderboard").addEventListener("click", async () => { tab = "leaderboard"; toast = null; render(); await loadAll(); render(); });
    document.getElementById("qb-tab-profile").addEventListener("click", () => {
      tab = "profile"; toast = null;
      profileForm.bio = me.bio || ""; profileForm.statusNote = me.status_note || "";
      profileForm.oldPassword = ""; profileForm.newPassword = "";
      profileForm.avatarUrl = me.avatar_url || "";
      profileForm.avatarSkin = me.avatar_skin || "";
      profileForm.nickname = me.nickname || "";
      render();
    });

    if (tab === "post") {
      document.getElementById("qb-title").addEventListener("input", e => { draft.title = e.target.value; });
      document.getElementById("qb-desc").addEventListener("input", e => { draft.desc = e.target.value; });
      document.getElementById("qb-reward").addEventListener("input", e => { draft.reward = e.target.value; });
      document.getElementById("qb-category").addEventListener("change", e => { draft.category = e.target.value; });
      document.getElementById("qb-difficulty").addEventListener("change", e => { draft.difficulty = e.target.value; });
      document.getElementById("qb-post-btn").addEventListener("click", postQuest);
    }

    if (tab === "board") {
      root.querySelectorAll(".qb-filter").forEach(b => b.addEventListener("click", () => { filterCategory = b.dataset.cat; render(); }));
      root.querySelectorAll(".qb-claim").forEach(b => b.addEventListener("click", () => claimQuest(b.dataset.id)));
      root.querySelectorAll(".qb-unclaim").forEach(b => b.addEventListener("click", () => unclaimQuest(b.dataset.id)));
      root.querySelectorAll(".qb-complete").forEach(b => b.addEventListener("click", () => completeQuest(b.dataset.id)));
      root.querySelectorAll(".qb-proof-upload-input").forEach(inp => inp.addEventListener("change", e => {
        uploadQuestProof(inp.dataset.id, e.target.files && e.target.files[0]);
      }));
      root.querySelectorAll(".qb-proof-remove").forEach(b => b.addEventListener("click", () => removeQuestProof(b.dataset.id)));
      root.querySelectorAll(".qb-proof-thumb").forEach(img => img.addEventListener("click", () => {
        lightboxPhoto = img.getAttribute("src");
        render();
      }));
      root.querySelectorAll(".qb-delete").forEach(b => b.addEventListener("click", () => deleteQuest(b.dataset.id)));
      root.querySelectorAll(".qb-admin-edit").forEach(b => b.addEventListener("click", () => {
        const q = quests.find(x => x.id === b.dataset.id);
        if (q) startEditQuest(q);
      }));
      root.querySelectorAll(".qb-save-edit").forEach(b => b.addEventListener("click", () => saveEditQuest(b.dataset.id)));
      root.querySelectorAll(".qb-cancel-edit").forEach(b => b.addEventListener("click", cancelEditQuest));
      if (editingQuestId) {
        const id = editingQuestId;
        const t = document.getElementById(`qb-edit-title-${id}`);
        const d = document.getElementById(`qb-edit-desc-${id}`);
        const r = document.getElementById(`qb-edit-reward-${id}`);
        const c = document.getElementById(`qb-edit-category-${id}`);
        const df = document.getElementById(`qb-edit-difficulty-${id}`);
        if (t) t.addEventListener("input", e => { editForm.title = e.target.value; });
        if (d) d.addEventListener("input", e => { editForm.desc = e.target.value; });
        if (r) r.addEventListener("input", e => { editForm.reward = e.target.value; });
        if (c) c.addEventListener("change", e => { editForm.category = e.target.value; });
        if (df) df.addEventListener("change", e => { editForm.difficulty = e.target.value; });
      }
    }

    if (tab === "search") {
      const input = document.getElementById("qb-search-input");
      input.addEventListener("input", e => { searchTerm = e.target.value; searchedPlayer = null; });
      input.addEventListener("keydown", e => { if (e.key === "Enter") searchPlayer(); });
      document.getElementById("qb-search-btn").addEventListener("click", searchPlayer);
      root.querySelectorAll(".qb-player-row").forEach(row => row.addEventListener("click", () => {
        searchedPlayer = players.find(p => p.username === row.dataset.username) || searchResults.find(p => p.username === row.dataset.username);
        render();
      }));
      const qrSave = document.getElementById("qb-quick-rank-save");
      if (qrSave) {
        qrSave.addEventListener("click", async () => {
          const sel = document.getElementById("qb-quick-rank-select");
          rankForm.username = qrSave.dataset.username;
          rankForm.rank = sel.value;
          await setPlayerRank();
        });
      }
      const qsSave = document.getElementById("qb-quick-state-save");
      if (qsSave) {
        qsSave.addEventListener("click", async () => {
          const sel = document.getElementById("qb-quick-state-select");
          stateForm.username = qsSave.dataset.username;
          stateForm.state = sel.value;
          await setPlayerState();
        });
      }
      const qbSave = document.getElementById("qb-quick-bio-save");
      if (qbSave) {
        qbSave.addEventListener("click", async () => {
          const bioInput = document.getElementById("qb-quick-bio-input");
          await setPlayerBio(qbSave.dataset.username, bioInput.value);
        });
      }
      const qaSave = document.getElementById("qb-quick-avatar-save");
      if (qaSave) {
        qaSave.addEventListener("click", async () => {
          const avatarInput = document.getElementById("qb-quick-avatar-input");
          await setPlayerAvatar(qaSave.dataset.username, avatarInput.value);
        });
      }
      const qiSave = document.getElementById("qb-quick-identity-save");
      if (qiSave) {
        qiSave.addEventListener("click", async () => {
          const usernameInput = document.getElementById("qb-quick-username-input");
          const nicknameInput = document.getElementById("qb-quick-nickname-input");
          await setPlayerIdentity(qiSave.dataset.username, usernameInput.value, nicknameInput.value);
        });
      }
    }

    if (tab === "info") {
      root.querySelectorAll(".qb-info-delete").forEach(b => b.addEventListener("click", () => deleteInfo(b.dataset.id)));
      if (isAdmin()) {
        const ii = document.getElementById("qb-info-input");
        if (ii) ii.addEventListener("input", e => { infoForm.message = e.target.value; });
        const ib = document.getElementById("qb-info-post-btn");
        if (ib) ib.addEventListener("click", postInfo);
      }
    }

    if (tab === "community") {
      root.querySelectorAll(".qb-community-delete").forEach(b => b.addEventListener("click", () => deleteCommunity(b.dataset.id)));
      root.querySelectorAll(".qb-community-like").forEach(b => b.addEventListener("click", () => toggleLikeCommunity(b.dataset.id)));
      root.querySelectorAll(".qb-community-reply-toggle").forEach(b => b.addEventListener("click", () => toggleReplyBox(b.dataset.id)));
      root.querySelectorAll(".qb-community-reply-send").forEach(b => b.addEventListener("click", () => postReply(b.dataset.id)));
      root.querySelectorAll(".qb-community-edit").forEach(b => b.addEventListener("click", () => {
        const post = communityPosts.find(p => p.id === b.dataset.id);
        if (post) startEditCommunity(post);
      }));
      root.querySelectorAll(".qb-community-save-edit").forEach(b => b.addEventListener("click", () => saveEditCommunity(b.dataset.id)));
      root.querySelectorAll(".qb-community-cancel-edit").forEach(b => b.addEventListener("click", cancelEditCommunity));
      if (me) {
        const ci = document.getElementById("qb-community-input");
        if (ci) ci.addEventListener("input", e => { communityForm.message = e.target.value; });
        const cb = document.getElementById("qb-community-post-btn");
        if (cb) cb.addEventListener("click", postCommunity);
      }
      if (replyOpenId) {
        const ri = document.getElementById(`qb-reply-input-${replyOpenId}`);
        if (ri) ri.addEventListener("input", e => { replyForm.message = e.target.value; });
      }
      if (editingCommunityId) {
        const ei = document.getElementById(`qb-community-edit-input-${editingCommunityId}`);
        if (ei) ei.addEventListener("input", e => { editCommunityForm.message = e.target.value; });
      }
    }

    if (tab === "leaderboard" && isAdmin()) {
      const su = document.getElementById("qb-score-username");
      const sv = document.getElementById("qb-score-value");
      if (su) su.addEventListener("input", e => { scoreForm.username = e.target.value; });
      if (sv) sv.addEventListener("input", e => { scoreForm.score = e.target.value; });
      const sb2 = document.getElementById("qb-score-save");
      if (sb2) sb2.addEventListener("click", setLeaderboardScore);

      const cu = document.getElementById("qb-create-username");
      const cr = document.getElementById("qb-create-rank");
      const cs = document.getElementById("qb-create-state");
      const cbtn = document.getElementById("qb-create-save");
      if (cu) cu.addEventListener("input", e => { createAccountForm.username = e.target.value; });
      if (cr) cr.addEventListener("change", e => { createAccountForm.rank = e.target.value; });
      if (cs) cs.addEventListener("change", e => { createAccountForm.state = e.target.value; });
      if (cbtn) cbtn.addEventListener("click", createAccount);
    }

    if (tab === "profile") {
      root.querySelectorAll(".qb-skin-pick").forEach(btn => btn.addEventListener("click", () => {
        profileForm.avatarSkin = btn.dataset.skin;
        profileForm.avatarUrl = ""; // clear any direct URL override
        render();
      }));
      document.getElementById("qb-profile-nickname").addEventListener("input", e => { profileForm.nickname = e.target.value; });
      document.getElementById("qb-profile-note").addEventListener("input", e => { profileForm.statusNote = e.target.value; });
      document.getElementById("qb-profile-bio").addEventListener("input", e => { profileForm.bio = e.target.value; });
      document.getElementById("qb-profile-old-pass").addEventListener("input", e => { profileForm.oldPassword = e.target.value; });
      document.getElementById("qb-profile-new-pass").addEventListener("input", e => { profileForm.newPassword = e.target.value; });
      document.getElementById("qb-profile-save").addEventListener("click", saveProfile);
      const skinUpload = document.getElementById("qb-skin-upload");
      if (skinUpload) skinUpload.addEventListener("change", e => handleSkinUpload(e.target.files && e.target.files[0]));
      initSkinCanvas();
    }

    if (tab === "players") {
      root.querySelectorAll(".qb-player-row").forEach(row => row.addEventListener("click", () => {
        tab = "search";
        searchTerm = row.dataset.username;
        searchedPlayer = players.find(p => p.username === row.dataset.username);
        searchResults = searchedPlayer ? [searchedPlayer] : [];
        render();
      }));
    }
  }

  function communityPostCard(post, isReply) {
    const author = players.find(pl => pl.username === post.username) || post.username;
    const canEditOrDelete = me && (isAdmin() || me.username === post.username);
    const isEditing = editingCommunityId === post.id;
    const liked = communityLikedByMe(post.id);
    const likeCount = communityLikeCount(post.id);
    const replies = isReply ? [] : communityReplies(post.id);
    return `
      <div style="${isReply ? `margin-left:26px; margin-top:10px; padding-left:12px; border-left:2px solid ${PALETTE.border};` : ""}">
        <div id="community-post-${post.id}" style="padding:14px; background:${isReply ? PALETTE.stone : PALETTE.panel2}; border:2px solid ${PALETTE.border};">
          <div style="display:flex; justify-content:space-between; align-items:center; gap:10px; margin-bottom:8px; flex-wrap:wrap;">
            <div style="display:flex; align-items:center; gap:8px; flex-wrap:wrap;">
              ${playerAvatarImg(author, 22, 18)}
              <span class="qb-pixel" style="font-size:9px; color:${PALETTE.gold};">${esc(displayName(author))}</span>
              <span style="font-size:13px; color:${PALETTE.textDim};">${timeAgo(post.created_at)}${post.edited_at ? " (edited)" : ""}</span>
            </div>
            ${canEditOrDelete && !isEditing ? `
              <div style="display:flex; gap:6px;">
                <button class="qb-btn qb-community-edit" data-id="${post.id}" style="${btn("edit", { color: PALETTE.blue, fontSize: 8, padding: "6px 10px" })}">edit</button>
                <button class="qb-btn qb-community-delete" data-id="${post.id}" style="${btn("delete", { color: PALETTE.danger, fontSize: 8, padding: "6px 10px" })}">delete</button>
              </div>
            ` : ""}
          </div>
          ${isEditing ? `
            <textarea id="qb-community-edit-input-${post.id}" class="qb-textarea" rows="3" maxlength="500">${esc(editCommunityForm.message)}</textarea>
            <div style="margin-top:8px; display:flex; gap:8px;">
              <button class="qb-btn qb-community-save-edit" data-id="${post.id}" ${savingCommunityEdit ? "disabled" : ""} style="${btn(savingCommunityEdit ? "saving..." : "save", { color: PALETTE.emerald, fontSize: 9, padding: "8px 12px", disabled: savingCommunityEdit })}">${savingCommunityEdit ? "saving..." : "save"}</button>
              <button class="qb-btn qb-community-cancel-edit" style="${btn("cancel", { color: PALETTE.stone, fontSize: 9, padding: "8px 12px" })}">cancel</button>
            </div>
          ` : `
            <div style="font-size:18px; color:${PALETTE.text}; line-height:1.4; white-space:pre-wrap;">${esc(post.message)}</div>
            <div style="margin-top:10px; display:flex; align-items:center; gap:14px;">
              <button class="qb-btn qb-community-like" data-id="${post.id}" ${me ? "" : "disabled"} style="${btn("like", { color: liked ? PALETTE.danger : PALETTE.stone, textColor: liked ? "#1a1d17" : PALETTE.text, fontSize: 9, padding: "6px 10px", disabled: !me })}">${liked ? "♥" : "♡"} ${likeCount}</button>
              ${!isReply && me ? `<button class="qb-btn qb-community-reply-toggle" data-id="${post.id}" style="${btn("reply", { color: PALETTE.stone, fontSize: 9, padding: "6px 10px" })}">${replyOpenId === post.id ? "cancel" : "reply"}</button>` : ""}
            </div>
          `}
          ${!isReply && replyOpenId === post.id ? `
            <div style="margin-top:12px; padding-top:12px; border-top:2px solid ${PALETTE.border};">
              <textarea id="qb-reply-input-${post.id}" class="qb-textarea" rows="2" maxlength="500" placeholder="write a reply...">${esc(replyForm.message)}</textarea>
              <div style="margin-top:8px;">
                <button class="qb-btn qb-community-reply-send" data-id="${post.id}" ${postingReply ? "disabled" : ""} style="${btn(postingReply ? "sending..." : "send reply", { color: PALETTE.emerald, fontSize: 9, padding: "8px 12px", disabled: postingReply })}">${postingReply ? "sending..." : "send reply"}</button>
              </div>
            </div>
          ` : ""}
        </div>
        ${replies.length ? replies.map(r => communityPostCard(r, true)).join("") : ""}
      </div>
    `;
  }

  function render() {
    root.style.background = PALETTE.bg;
    root.style.minHeight = "100vh";
    if (mustSetPassword && me) {
      renderForcePassword();
    } else if (!me) {
      renderAuth();
    } else {
      renderMain();
    }
  }

  window.addEventListener("click", () => {
    if (notifOpen) { notifOpen = false; render(); }
  });

  window.addEventListener("beforeunload", () => {
    if (me) {
      navigator.sendBeacon(
        `${SUPABASE_URL}/rest/v1/quest_players?username=eq.${encodeURIComponent(me.username)}`,
        new Blob([JSON.stringify({ status: "offline" })], { type: "application/json" })
      );
    }
  });

  async function tryRestoreSession() {
    let saved = null;
    try {
      const raw = localStorage.getItem(SESSION_KEY);
      if (raw) saved = JSON.parse(raw);
    } catch (e) { saved = null; }
    if (!saved || !saved.username || !saved.session_token) {
      render();
      return;
    }
    loading = true; render();
    const { data, error } = await sb.rpc("qb_check_session", { p_username: saved.username, p_session_token: saved.session_token }).single();
    if (error || !data || !data.username) {
      clearSession();
      loading = false;
      render();
      return;
    }
    me = { username: data.username, status: data.status, status_note: data.status_note, bio: data.bio, rank: data.rank, state: data.state, created_at: data.created_at, last_seen: data.last_seen, session_token: saved.session_token, avatar_url: data.avatar_url || null };
    await sb.rpc("qb_set_status", { p_username: me.username, p_session_token: me.session_token, p_status: "online" });
    await loadAll();
    loading = false;
    startHeartbeat();
    loadNotifSeen();
    loadNotifFilters();
    render();
  }

  tryRestoreSession();
})();
</script>
